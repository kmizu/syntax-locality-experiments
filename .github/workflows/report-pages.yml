name: Verify experiment and publish report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: syntax-report-pages-single-runner
  cancel-in-progress: false

jobs:
  verify-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: sbt/setup-sbt@v1
      - name: Required full Scala experiment tests
        shell: bash
        run: sbt test
      - name: Generate HTML twice from saved reports
        shell: bash
        working-directory: reports
        env:
          SYNTAX_P2_TEST_VERIFIED: 'true'
          SYNTAX_REPORT_WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          sbt 'run ../experiments/data ../experiments/site' 'run ../experiments/data ../experiments/site-reproduction'
          diff -r ../experiments/site ../experiments/site-reproduction
      - name: Verify saved mock evidence and fail-closed publication
        shell: pwsh
        env:
          SYNTAX_P2_TEST_VERIFIED: 'true'
          SYNTAX_REPORT_WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $expectedWitnessHash = '224e9091619a7ce85cce16c663fff2238b3694161fc4f5540734bfd383b5c4dc'
          $provenance = Get-Content -LiteralPath experiments/site/build-provenance.json -Raw | ConvertFrom-Json
          $expectedMockSourceHash = '41ffc2647b8f3c3838a17c2425b0be97007fe611f5d0a68d3dd9d1c79e1b0b96'
          if ($provenance.p2StandaloneMockVerified -ne $true -or $provenance.p2MockWitnessSha256 -ne $expectedWitnessHash -or $provenance.p2MockSourceHash -ne $expectedMockSourceHash) { throw 'Published historical mock evidence does not match the saved witness' }
          $dataRoot = [IO.Path]::GetFullPath((Join-Path $PWD 'experiments/data'))
          $absentRoot = [IO.Path]::GetFullPath((Join-Path $PWD 'experiments/data-mock-witness-absent'))
          $changedRoot = [IO.Path]::GetFullPath((Join-Path $PWD 'experiments/data-mock-witness-changed'))
          foreach ($testRoot in @($absentRoot, $changedRoot)) {
            if (Test-Path -LiteralPath $testRoot) { throw 'Evidence check requires a fresh copied input directory' }
            Copy-Item -LiteralPath $dataRoot -Destination $testRoot -Recurse
          }
          $absentWitness = [IO.Path]::GetFullPath((Join-Path $absentRoot 'supporting/p2-mock-verification.json'))
          if (-not $absentWitness.StartsWith($absentRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::Ordinal)) { throw 'Copied witness path escaped its test directory' }
          Remove-Item -LiteralPath $absentWitness
          Push-Location reports
          try {
            sbt 'run ../experiments/data-mock-witness-absent ../experiments/site-mock-witness-absent'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
          $fallback = Get-Content -LiteralPath experiments/site-mock-witness-absent/build-provenance.json -Raw | ConvertFrom-Json
          if ($fallback.p2StandaloneMockVerified -ne $false -or $null -ne $fallback.p2MockWitnessSha256) { throw 'Absent saved witness must not establish mock completion' }
          foreach ($field in @('p2LiveGenerations','p2LiveReportAvailable','p2LiveExecutionStatusAvailable','p2LiveExecutionSnapshotAt','p2LiveExecutionStatusPath','p2LiveExecutionStatusSha256','p2LiveTerminalDispositions','p2LivePlannedTrials','p2LiveCountsBasis','p2LiveReportDispatched','p2LiveReportTerminalDispositions','p2LiveExecutionDistinctDispatched','p2LiveExecutionTerminalDispositions')) {
            if ($provenance.PSObject.Properties.Name -notcontains $field -or $fallback.PSObject.Properties.Name -notcontains $field) { throw "P2 execution/report provenance field missing: $field" }
            if ($fallback.$field -cne $provenance.$field) { throw "Historical mock-witness absence changed separate real P2 provenance: $field" }
          }
          if (Test-Path -LiteralPath experiments/data/p2) {
            foreach ($name in @('summary.csv','paired-comparisons.csv','errors.csv','report.md','protocol.json')) {
              $normalHash = (Get-FileHash -LiteralPath (Join-Path experiments/site/data/p2 $name) -Algorithm SHA256).Hash
              $fallbackHash = (Get-FileHash -LiteralPath (Join-Path experiments/site-mock-witness-absent/data/p2 $name) -Algorithm SHA256).Hash
              if ($normalHash -ne $fallbackHash) { throw 'Historical mock-witness absence changed a saved real P2 report' }
            }
          }
          $changedWitness = [IO.Path]::GetFullPath((Join-Path $changedRoot 'supporting/p2-mock-verification.json'))
          if (-not $changedWitness.StartsWith($changedRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::Ordinal)) { throw 'Copied witness path escaped its test directory' }
          [IO.File]::AppendAllText($changedWitness, ' ', [Text.UTF8Encoding]::new($false))
          $PSNativeCommandUseErrorActionPreference = $false
          Push-Location reports
          try {
            sbt 'run ../experiments/data-mock-witness-changed ../experiments/site-mock-witness-changed' *> ../mock-witness-rejection.log
            $rejectedExit = $LASTEXITCODE
          } finally { Pop-Location }
          if ($rejectedExit -eq 0) { throw 'Changed saved witness was incorrectly accepted' }
          $rejection = Get-Content -LiteralPath mock-witness-rejection.log -Raw
          if (-not $rejection.Contains('Unexpected P2 mock witness bytes')) { throw 'Changed witness failed for an unrelated reason' }
          if (Test-Path -LiteralPath experiments/site-mock-witness-changed/index.html) { throw 'Changed witness must be rejected before HTML is written' }
          Write-Output 'Historical mock witness accepted; absent witness cannot establish mock completion or alter real P2 status; changed bytes rejected before publication.'
          exit 0
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload reproducible report artifact
        uses: actions/upload-artifact@v4
        with:
          name: syntax-html-report
          path: experiments/site
          retention-days: 14
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: experiments/site
      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
